project:
  type: website
  pre-render:
    - python3 scripts/build-direct-downloads.py
  post-render:
    - python3 scripts/version-stylesheet.py
  render:
    - index.qmd
    - installation.qmd
    - presentations/
    - code/
    - homeworks/
  resources:
    - data/
    - images/
    - zipfiles/*.zip
    - downloads/*.qmd
  output-dir: docs

publish:
  gh-pages: true

website:
  title: "Biostatistics in R"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: index.qmd#lessons
        text: Lessons
      - href: index.qmd#presentations
        text: Presentations
      - href: index.qmd#homeworks
        text: Homeworks
      - href: index.qmd#reference-materials
        text: Reference materials

format:
  html:
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    theme: readable

editor: visual
